name: PHP docker CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v3

      - name: Build Docker images
        run: docker compose -f lab9/docker-compose.yml build

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Clone repo
        uses: actions/checkout@v3

      - name: Start docker
        run: docker compose -f lab9/docker-compose.yml up -d

      - name: Wait for services
        run: sleep 15

      - name: Check containers
        run: docker ps

      - name: Install dependencies
        run: docker compose -f lab9/docker-compose.yml exec -T php composer install

  
      - name: Start PHP server
        run: docker compose -f lab9/docker-compose.yml exec -d php php -S 0.0.0.0:8000 -t code/

      - name: Run tests
        run: docker compose -f lab9/docker-compose.yml exec -T php ./vendor/bin/phpunit tests

      - name: Show logs on error
        if: failure()
        run: docker compose -f lab9/docker-compose.yml logs

      - name: Stop containers
        if: always()
        run: docker compose -f lab9/docker-compose.yml down